[package]
name = "adm-toolbox"
version = "0.1.0"
edition = "2024"
description = "Portable Linux-like administration shell for Windows"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.29"
dns-lookup = "2.0"
ipnet = "2.11"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
sysinfo = "0.37"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
