[package]
name = "adm-toolbox"
version = "0.1.0"
edition = "2024"
description = "Portable Linux-like administration shell for Windows"

[dependencies]
brush-core = "0.5.0"
brush-builtins = "0.2.0"
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
crossterm = "0.29"
dns-lookup = "2.0"
ipnet = "2.11"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
snmp2 = "0.5.2"
sysinfo = "0.37"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time", "process"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
