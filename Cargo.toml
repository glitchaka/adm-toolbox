[package]
name = "adm-toolbox"
version = "0.1.0"
edition = "2024"
description = "Portable Bash-compatible administration shell for Windows"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
crossterm = "0.29"
dns-lookup = "2.0"
glob = "0.3"
zip = "0.6"
tar = "0.4"
flate2 = "1.1"
ipnet = "2.11"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
snmp2 = "0.5.2"
sysinfo = "0.37"
vt100 = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Threading",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement", "Win32_Networking_WinSock",
] }
