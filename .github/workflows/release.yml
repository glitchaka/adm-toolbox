name: publish-release

on:
  push:
    branches: [main]
    paths:
      - ".release/v*.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish pending releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for notes in .release/v*.md; do
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes"
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "Shell Shock Tool ${tag#v}" \
                --notes-file "$notes"
            fi
          done
